##############################################################################
# zi-pay — Production Docker Compose for Coolify
#
# Architecture: Separate frontend + backend services
#   Frontend: nginx serving Vite SPA → pay.zipremiumservices.com
#   Backend:  Express.js API → pay.zipremiumservices.com/api
#   Database: MongoDB — EXTERNAL (Coolify-managed DB / Atlas)
#
# ⚠️ MongoDB is NOT bundled here. Set MONGODB_URI in the Coolify resource's
#    environment variables to the Coolify-managed MongoDB URL (or Atlas).
#    This avoids the backend container restart loop caused by trying to
#    resolve the internal "mongo" hostname.
#
# NOTE: Coolify is configured to build this exact file (docker-compose.yaml).
# Do not rename it and do not create a competing docker-compose.yml —
# Coolify resolves the compose file by its configured path only.
#
# SSL is handled by Coolify's reverse proxy (Traefik/Caddy) automatically.
# Build contexts point at the monorepo root (pnpm workspace lockfile lives there).
##############################################################################

services:
  # ───────────────────── Frontend (nginx SPA) ────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Same-origin: the SPA calls /api and /socket.io on its own origin,
        # nginx proxies those to the backend service over the internal network.
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-}
        VITE_MAIN_SITE_URL: ${VITE_MAIN_SITE_URL:-https://zipremiumservices.com}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ───────────────────── Backend (Express API) ───────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    expose:
      - "5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - BASE_URL=${BASE_URL:-/api}
      # Runtime env — set these in Coolify.
      # MONGODB_URI is REQUIRED: point it at the Coolify-managed MongoDB URL
      # (e.g. mongodb://user:pass@mongo.internal:27017/zipay?authSource=admin)
      # or MongoDB Atlas. There is NO bundled mongo container anymore.
      - MONGODB_URI=${MONGODB_URI:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_ACCESS_EXPIRY=${JWT_ACCESS_EXPIRY:-15m}
      - JWT_REFRESH_EXPIRY=${JWT_REFRESH_EXPIRY:-7d}
      - FRONTEND_URL=${FRONTEND_URL:-https://pay.zipremiumservices.com}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://pay.zipremiumservices.com,https://zipremiumservices.com,https://www.zipremiumservices.com}
      - WEBHOOK_SIGNING_SECRET=${WEBHOOK_SIGNING_SECRET:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    volumes:
      - uploads-data:/app/backend/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 6
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  # ───────────────────── MongoDB ────────────────────────────────────────────
  # NOTE: MongoDB is intentionally NOT defined here.
  # Use a Coolify-managed database or MongoDB Atlas and pass its connection
  # string via the MONGODB_URI environment variable on the backend resource.

# ────────────────────── Persisted Volumes ──────────────────────────────────
volumes:
  uploads-data:

# ────────────────────── Network ────────────────────────────────────────────
networks:
  default:
    name: zipay-network
