# ──────────────────────────────────────────────────────────────────────────────
# zi-pay Frontend Nginx Configuration
# Serves the Vite + React SPA with proper SPA fallback routing
# Used inside the frontend Docker container
# ──────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security Headers ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Gzip Compression ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2;

    # ── Static Assets with Cache ──
    # Vite produces hashed filenames like /assets/index-Dh3f8a2L.js
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Favicon and robots ──
    location = /favicon.ico {
        expires 30d;
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        expires 30d;
        access_log off;
    }

    # ── SPA Fallback ──
    # All non-file routes serve index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Proxy API requests to backend (same-origin) ──
    # The SPA talks to /api and /socket.io on its own origin; nginx forwards
    # those to the backend service over the internal docker network.
    location /api/ {
        proxy_pass http://backend:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # ── Proxy Socket.IO to backend (WebSocket upgrade) ──
    location /socket.io/ {
        proxy_pass http://backend:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
