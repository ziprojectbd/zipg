##############################################################################
# zi-pay — Production Docker Compose for Coolify
#
# Architecture: Frontend + Backend + MongoDB (single stack)
#   Frontend: nginx serving Vite SPA → pay.zipremiumservices.com
#   Backend:  Express.js API → pay.zipremiumservices.com/api
#   Database: MongoDB (mongo:7) bundled in this compose stack
#
# ⚠️ MongoDB is bundled here. The backend's retry loop
#    (backend/src/config/database.ts) keeps the API alive while the DB
#    boots or recovers — no Coolify restart loop.
#
# ⚠️ Security: set MONGO_ROOT_USERNAME / MONGO_ROOT_PASSWORD in Coolify to
#    strong values. The backend connects via authSource=admin. Override
#    MONGODB_URI entirely if you prefer an external DB (e.g. MongoDB Atlas).
#
# NOTE: Coolify is configured to build this exact file (docker-compose.yaml).
# Do not rename it and do not create a competing docker-compose.yml —
# Coolify resolves the compose file by its configured path only.
#
# SSL is handled by Coolify's reverse proxy (Traefik/Caddy) automatically.
# Build contexts point at the monorepo root (pnpm workspace lockfile lives there).
##############################################################################

services:
  # ───────────────────── Frontend (nginx SPA) ────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Same-origin: the SPA calls /api and /socket.io on its own origin,
        # nginx proxies those to the backend service over the internal network.
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-}
        VITE_MAIN_SITE_URL: ${VITE_MAIN_SITE_URL:-https://zipremiumservices.com}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ───────────────────── Backend (Express API) ───────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    expose:
      - "5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - BASE_URL=${BASE_URL:-/api}
      # MONGODB_URI defaults to the bundled mongo service below, using the
      # same MONGO_ROOT_* credentials. Override with an external DB if needed
      # (e.g. mongodb+srv://user:pass@cluster.mongodb.net/zipay).
      - MONGODB_URI=${MONGODB_URI:-mongodb://${MONGO_ROOT_USERNAME:-zipay}:${MONGO_ROOT_PASSWORD:-zipay_change_me}@mongo:27017/zipay?authSource=admin}
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_ACCESS_EXPIRY=${JWT_ACCESS_EXPIRY:-15m}
      - JWT_REFRESH_EXPIRY=${JWT_REFRESH_EXPIRY:-7d}
      - FRONTEND_URL=${FRONTEND_URL:-https://pay.zipremiumservices.com}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://pay.zipremiumservices.com,https://zipremiumservices.com,https://www.zipremiumservices.com}
      - WEBHOOK_SIGNING_SECRET=${WEBHOOK_SIGNING_SECRET:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    volumes:
      - uploads-data:/app/backend/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 6
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  # ───────────────────── MongoDB ────────────────────────────────────────────
  mongo:
    image: mongo:7
    restart: unless-stopped
    # Internal only — never expose the DB port to the public internet.
    expose:
      - "27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-zipay}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-zipay_change_me}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u \"$${MONGO_INITDB_ROOT_USERNAME}\" -p \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\""]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.75"

# ────────────────────── Persisted Volumes ──────────────────────────────────
volumes:
  uploads-data:
  mongo-data:

# ────────────────────── Network ────────────────────────────────────────────
networks:
  default:
    name: zipay-network
