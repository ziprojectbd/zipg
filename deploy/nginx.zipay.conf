# ═══════════════════════════════════════════════════════════════════════════
# zi-pay — Nginx reverse proxy (optional; Coolify provides this via Traefik/Caddy)
#
# This config is intended as a REFERENCE for a standalone Nginx deployment
# of pay.zipremiumservices.com in front of the Express container (port 3001).
#
# With Coolify you do NOT need this file — Coolify's proxy terminates TLS
# (Let's Encrypt) and routes Host: pay.zipremiumservices.com to the app container.
#
# HTTPS is terminated at the proxy; the Express container only speaks HTTP on
# 3001 (Docker's internal network).
# ═══════════════════════════════════════════════════════════════════════════

# Force HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name pay.zipremiumservices.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name pay.zipremiumservices.com;

  # ── TLS (Let's Encrypt via certbot) ──
  ssl_certificate     /etc/letsencrypt/live/pay.zipremiumservices.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/pay.zipremiumservices.com/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;

  # ── Security headers ──
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-XSS-Protection "1; mode=block" always;

  # ── Gzip ──
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript
             application/xml image/svg+xml text/xml application/x-font-ttf;

  # ── SPA + API are both served by the Express container (port 3001) ──
  location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }

  # ── Socket.IO (WebSocket upgrade) ──
  location /socket.io/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 60s;
  }

  # ── Uploads (7-day cache — matches Express static config) ──
  location /uploads/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header Host $host;
    expires 7d;
    add_header Cache-Control "public";
  }
}