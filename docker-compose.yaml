##############################################################################
# zi-pay Docker Compose — production deployment for Coolify
# https://pay.zipremiumservices.com
#
# Coolify reads docker-compose.yml at the project root. All secrets are
# injected via Coolify "Environment Variables" (${VAR} interpolation) —
# never hardcoded here.
##############################################################################

services:
  # ───────────────────── Express + SPA (port 3001) ──────────────────────────
  app:
    build:
      context: ./
      dockerfile: Dockerfile
      args:
        # Vite build-time variables — baked into the frontend bundle
        VITE_API_URL: ${VITE_API_URL:-https://pay.zipremiumservices.com}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-https://pay.zipremiumservices.com}
        VITE_MAIN_SITE_URL: ${VITE_MAIN_SITE_URL:-https://zipremiumservices.com}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "3001:3001"
    expose:
      - "3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      # Runtime env — set these in Coolify
      - MONGODB_URI=${MONGODB_URI:-mongodb://zipay:${MONGO_INITDB_ROOT_PASSWORD:-zipay-secure-change-me}@mongo:27017/zipay?authSource=admin}
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_ACCESS_EXPIRY=${JWT_ACCESS_EXPIRY:-15m}
      - JWT_REFRESH_EXPIRY=${JWT_REFRESH_EXPIRY:-7d}
      - FRONTEND_URL=${FRONTEND_URL:-https://pay.zipremiumservices.com}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://pay.zipremiumservices.com,https://zipremiumservices.com,https://www.zipremiumservices.com}
      - WEBHOOK_SIGNING_SECRET=${WEBHOOK_SIGNING_SECRET:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    volumes:
      - uploads-data:/app/backend/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  # ───────────────────── MongoDB ────────────────────────────────────────────
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-zipay}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-zipay-secure-change-me}
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

# ────────────────────── Persisted Volumes ──────────────────────────────────
volumes:
  mongo-data:
  mongo-config:
  uploads-data:

# ────────────────────── Network ────────────────────────────────────────────
networks:
  default:
    name: zipay-network