##############################################################################
# zi-pay — Production Docker Compose for Coolify
#
# Architecture: Separate frontend + backend services
#   Frontend: nginx serving Vite SPA → pay.zipremiumservices.com
#   Backend:  Express.js API → pay.zipremiumservices.com/api
#   Database: MongoDB (Coolify managed DB or bundled)
#
# NOTE: Coolify is configured to build this exact file (docker-compose.yaml).
# Do not rename it and do not create a competing docker-compose.yml —
# Coolify resolves the compose file by its configured path only.
#
# SSL is handled by Coolify's reverse proxy (Traefik/Caddy) automatically.
# Build contexts point at the monorepo root (pnpm workspace lockfile lives there).
##############################################################################

services:
  # ───────────────────── Frontend (nginx SPA) ────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://pay.zipremiumservices.com/api}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-https://pay.zipremiumservices.com}
        VITE_MAIN_SITE_URL: ${VITE_MAIN_SITE_URL:-https://zipremiumservices.com}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ───────────────────── Backend (Express API) ───────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    expose:
      - "5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - BASE_URL=${BASE_URL:-https://pay.zipremiumservices.com/api}
      # Runtime env — set these in Coolify
      - MONGODB_URI=${MONGODB_URI:-mongodb://zipay:${MONGO_INITDB_ROOT_PASSWORD:-zipay-secure-change-me}@mongo:27017/zipay?authSource=admin}
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_ACCESS_EXPIRY=${JWT_ACCESS_EXPIRY:-15m}
      - JWT_REFRESH_EXPIRY=${JWT_REFRESH_EXPIRY:-7d}
      - FRONTEND_URL=${FRONTEND_URL:-https://pay.zipremiumservices.com}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://pay.zipremiumservices.com,https://zipremiumservices.com,https://www.zipremiumservices.com}
      - WEBHOOK_SIGNING_SECRET=${WEBHOOK_SIGNING_SECRET:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    volumes:
      - uploads-data:/app/backend/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  # ───────────────────── MongoDB ────────────────────────────────────────────
  # Only needed if NOT using a Coolify managed database or MongoDB Atlas
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-zipay}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-zipay-secure-change-me}
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

# ────────────────────── Persisted Volumes ──────────────────────────────────
volumes:
  mongo-data:
  mongo-config:
  uploads-data:

# ────────────────────── Network ────────────────────────────────────────────
networks:
  default:
    name: zipay-network
